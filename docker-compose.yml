# Docker Compose configuration for Sample Size Calculator
# Requirements: 35.1, 35.2, 35.4
# 
# This configuration deploys the Sample Size Calculator application with:
# - Internal storage for logs and reports (no host mounts to avoid permission issues)
# - Configurable environment variables
# - Health checks for reliability
# - Automatic restart policy

services:
  sample-size-calculator:
    build:
      context: .
      dockerfile: Dockerfile
    
    # Map ports for web interface and JupyterLab
    ports:
      - "${PORT:-8080}:8080"     # Web interface
      - "8888:8888"               # JupyterLab (required for Windows Docker)
    
    # Volume mounts for development/debugging only
    # Production use: remove these to avoid permission issues
    volumes:
      # Uncomment to persist logs to host (requires permission handling)
      # - ./logs:/app/logs
      
      # Uncomment to persist config to host (requires permission handling)
      # - ./config:/app/config
      
      # Uncomment to persist reports to host (requires permission handling)
      # - ./reports:/app/reports
      
      # Uncomment to persist notebooks to host (requires permission handling)
      - ./notebooks:/app/notebooks
    
    # Environment variables for application configuration
    environment:
      # Logging configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-90}
      
      # Application port (internal)
      - PORT=8080
      
      # JupyterLab configuration (improved Docker detection for Windows)
      - DOCKER_CONTAINER=true
      - JUPYTER_PORT=8888
      
      # Python environment
      - PYTHONUNBUFFERED=1
    
    # Restart policy: restart unless explicitly stopped
    restart: unless-stopped
    
    # Health check configuration
    # Verifies the web interface is accessible and responding
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    
    # Container name for easy reference
    container_name: sample-size-calculator
    
    # Resource limits (optional, can be adjusted based on needs)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

[project]
name = "sample-size-calculator"
version = "1.0.5"
description = "Medical device design verification and process validation sample size calculator"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Sample Size Calculator Team" }
]
keywords = ["medical-device", "validation", "sample-size", "statistics", "qms"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "jupyterlab>=4.5.4",
    "matplotlib>=3.10.8",
    "nicegui>=3.7.1",
    "numpy>=2.4.2",
    "pandas>=2.2.3",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
    "pypdf>=6.7.2",
    "pytest-mock>=3.15.1",
    "python-semantic-release>=10.5.3",
    "reportlab>=4.4.10",
    "scipy>=1.17.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.151.9",
    "jupyterlab>=4.5.4",
    "matplotlib>=3.10.8",
    "mypy>=1.19.1",
    "pandas>=3.0.1",
    "playwright>=1.58.0",
    "pypdf2>=3.0.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-json-report>=1.5.0",
    "pytest-playwright>=0.7.2",
    "ruff>=0.15.2",
    "seaborn>=0.13.2",
    "ty>=0.0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_size_calculator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "iq: Installation Qualification tests",
    "oq: Operational Qualification tests",
    "pq: Performance Qualification tests",
    "urs(urs_ids): URS requirement traceability marker - accepts one or more URS IDs",
]

[tool.coverage.run]
source = ["src/sample_size_calculator"]
omit = ["tests/*", "scripts/*", "*ui_controller.py"]

[tool.coverage.report]
show_missing = true

[tool.pytest-json-report]
# Include marker information in JSON report
include_markers = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N806", "PT018", "W293"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.semantic_release]
# Wo soll die Version aktualisiert werden?
version_variables = ["src/sample_size_calculator/version.py:__version__"]
version_toml = ["pyproject.toml:project.version"]

# Variante A: KEIN Zurückschreiben in den Branch
commit_version_number = false 

# Welche Commits lösen was aus? (Standard: Conventional Commits)
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"
order = 0

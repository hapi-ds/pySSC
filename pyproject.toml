[project]
name = "sample-size-calculator"
version = "0.1.0"
description = "Medical device design verification and process validation sample size calculator"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Sample Size Calculator Team" }
]
keywords = ["medical-device", "validation", "sample-size", "statistics", "qms"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "matplotlib>=3.10.8",
    "nicegui>=3.7.1",
    "numpy>=2.4.2",
    "pandas>=2.2.3",
    "pydantic>=2.12.5",
    "pypdf>=6.7.2",
    "reportlab>=4.4.10",
    "scipy>=1.17.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.151.9",
    "jupyterlab>=4.5.4",
    "matplotlib>=3.10.8",
    "mypy>=1.19.1",
    "pandas>=3.0.1",
    "playwright>=1.58.0",
    "pypdf2>=3.0.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-playwright>=0.7.2",
    "ruff>=0.15.2",
    "seaborn>=0.13.2",
    "ty>=0.0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_size_calculator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "iq: Installation Qualification tests",
    "oq: Operational Qualification tests",
    "pq: Performance Qualification tests",
    "urs: URS requirement traceability marker",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N806", "PT018", "W293"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
